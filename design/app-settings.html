<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幕聊 · 知識庫設定（WebView 正式版）</title>
<link rel="stylesheet" href="fonts/fonts.css"><!-- 本機字型，離線可跑 -->
<style>
/* ============================================================
   幕聊 · 畫面 5 知識庫設定頁 —— WebView 正式版
   從 settings-page.html 抽出、拿掉桌機展示外框（.page/.decks/.caption），
   改成吃滿真實裝置螢幕、支援 safe-area 的全螢幕版本。
   視覺 token、假引擎（mockExtract）、互動邏輯完全沿用，未改寫。
   真 API 接上 /extract 時，只需替換 runExtract() 裡的 setTimeout 區塊。
   ============================================================ */

:root{
  --void:  #040506;
  --ink:   #07080a;
  --obsid: #111214;
  --graph: #1b1c1e;
  --slate: #363739;
  --iron:  #454647;
  --smoke: #6a6b6c;
  --ash:   #9c9c9d;
  --mist:  #e6e6e6;
  --white: #ffffff;
  --coral: #ff6363;
  --ember: #452324;
  --amber: #4a3a1f;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, monospace;
  --vh: 1vh;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; height:100%; overscroll-behavior: none; }
body{
  height: calc(var(--vh, 1vh) * 100);
  background: var(--void); color: var(--white);
  font-family: "Noto Sans TC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button{ font-family: inherit; cursor: pointer; }

.screen{
  position: relative; width: 100%; height: 100%;
  display:flex; flex-direction:column;
  background: var(--void);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.apphead{
  flex:none; display:flex; align-items:center; gap:8px; padding:12px 16px 8px;
}
.apphead .ttl{ font-size:15px; font-weight:500; line-height:1.3; color: var(--white); }
.apphead .cnt{ margin-left:auto; font-family: var(--mono); font-size:10px; letter-spacing:.3px; color: var(--smoke); }
.diamond{ background: var(--coral); transform: rotate(45deg); flex:none; }
.eyebrow{
  font-family: var(--mono); font-size:10px; line-height:1;
  letter-spacing:.8px; text-transform:uppercase; color: var(--smoke);
}

.scroll{
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:8px 16px 24px; padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; gap:8px;
}

.sect{ display:flex; align-items:center; gap:8px; padding:16px 0 4px; }
.sect .eyebrow{ color: var(--smoke); }
.sect .ln{ flex:1; height:1px; background: rgba(255,255,255,0.06); }

.chip{
  font-family: var(--mono); font-size:10px; line-height:1.6; letter-spacing:.3px;
  border-radius:6px; padding:3px 6px; white-space:nowrap;
  background: var(--graph); color: var(--ash); font-variant-numeric: tabular-nums;
}
.chip.amber{ background: var(--amber); color: var(--mist); box-shadow: rgba(255,255,255,0.06) 0 0 0 1px inset; }
.chip.ghost{ background:transparent; border:1px solid var(--slate); }
.datep{ font-family: var(--mono); font-size:10px; letter-spacing:.3px; color: var(--smoke); white-space:nowrap; }

/* ============================================================
   第 1 步 · 餵入區（單一加入口）
   ============================================================ */
.feeder{
  position:relative; background: var(--obsid); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:12px; overflow:hidden;
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
}
.feeder::before{
  content:''; position:absolute; left:0; top:0; height:1px; width:35%; opacity:0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
}
.feeder.reading::before{ opacity:1; animation: sweep 900ms linear infinite; }
@keyframes sweep{ from{ transform: translateX(-100%) } to{ transform: translateX(286%) } }
.feeder textarea{
  width:100%; min-height:72px; resize:none; border:0; outline:0;
  background: var(--ink); border-radius:8px; padding:10px 12px;
  font-family: inherit; font-size:15px; line-height:1.6; color: var(--mist);
  box-shadow: rgba(255,255,255,0.06) 0 0 0 1px inset;
}
.feeder textarea::placeholder{ color: var(--smoke); }
.feedrow{ display:flex; align-items:center; gap:8px; }
.feedhint{ flex:1; font-size:11px; line-height:1.5; color: var(--smoke); }
.btn-extract{
  flex:none; height:44px; min-width:44px; padding:0 16px; border-radius:8px; border:0;
  background: var(--mist); color: var(--iron); font-size:14px; font-weight:500;
  box-shadow: rgba(255,255,255,0.85) 0 1px 0 0 inset, rgba(0,0,0,0.30) 0 -1.5px 0 0 inset;
  transition: transform 110ms var(--ease), background 110ms var(--ease), opacity 150ms var(--ease);
}
.btn-extract:active{ transform: translateY(1px) scale(0.98); background: var(--white); }
.btn-extract:disabled{ opacity:.4; cursor:default; }
.samples{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.samples .lb{ font-family: var(--mono); font-size:9px; letter-spacing:.8px; text-transform:uppercase; color: var(--iron); }
.sample{
  min-height:36px; font-size:12px; line-height:1; padding:8px 11px; border-radius:8px;
  background:transparent; color: var(--ash); border:1px solid var(--slate);
}

/* ============================================================
   第 2 步 · 草稿卡（主角：internal 開關）
   ============================================================ */
.draft{
  background: var(--obsid); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:10px;
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
  transition: box-shadow 200ms var(--ease);
  animation: rise 420ms var(--ease) both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
.draft.internal{
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset, 0 0 0 1px var(--amber);
}
.draft .top{ display:flex; align-items:baseline; gap:8px; }
.draft .lb{ flex:1; min-width:0; font-size:14px; font-weight:500; line-height:1.4; color: var(--white); }
.draft .content{ font-size:13px; line-height:1.6; color: var(--ash); text-wrap:pretty; }
.draft .tagline{ display:flex; gap:6px; flex-wrap:wrap; }
.introw{
  display:flex; align-items:center; gap:12px;
  margin-top:2px; padding-top:12px;
  box-shadow: rgba(255,255,255,0.05) 0 1px 0 0 inset;
}
.introw .tx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.introw .t1{
  font-size:12px; font-weight:500; line-height:1.4; color: var(--smoke);
  transition: color 200ms var(--ease);
}
.draft.internal .introw .t1{ color: var(--mist); }
.introw .t2{ font-size:12px; line-height:1.5; color: var(--smoke); text-wrap:pretty; }
.switch{
  flex:none; width:44px; height:26px; border-radius:9999px; border:0; padding:3px;
  background: var(--graph); display:flex; justify-content:flex-start;
  box-shadow: rgba(0,0,0,0.30) 0 1px 2px 0 inset;
  transition: background 200ms var(--ease);
}
.switch .knob{
  width:20px; height:20px; border-radius:9999px; background: var(--iron);
  transition: transform 200ms var(--ease), background 200ms var(--ease);
}
.switch[aria-checked="true"]{ background: var(--amber); }
.switch[aria-checked="true"] .knob{ transform: translateX(18px); background: var(--mist); }
.confirmrow{ display:flex; align-items:center; gap:12px; padding-top:4px; }
.btn-confirm{
  flex:1; height:44px; border-radius:8px; border:0;
  background: var(--mist); color: var(--iron); font-size:14px; font-weight:500;
  box-shadow: rgba(255,255,255,0.85) 0 1px 0 0 inset, rgba(0,0,0,0.30) 0 -1.5px 0 0 inset;
  transition: transform 110ms var(--ease), background 110ms var(--ease);
}
.btn-confirm:active{ transform: translateY(1px) scale(0.99); background: var(--white); }
.linkbtn{
  flex:none; border:0; background:transparent; padding:8px 4px; min-height:44px;
  font-family: var(--mono); font-size:10px; letter-spacing:.3px; line-height:1.6; color: var(--smoke);
}
.nores{
  background: var(--obsid); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:10px;
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
  animation: rise 420ms var(--ease) both;
}
.nores .why{ font-size:14px; line-height:1.6; color: var(--mist); text-wrap:pretty; }
.nores .orig{
  background: var(--ink); border-radius:8px; padding:10px 12px;
  font-size:13px; line-height:1.6; color: var(--smoke); white-space:pre-wrap;
  box-shadow: rgba(255,255,255,0.05) 0 0 0 1px inset;
}

/* ---------- 第 3 步之後 · 列表列（定案 A） ---------- */
.rowitem{ display:flex; flex-direction:column; gap:6px; padding:10px 0; }
.rowitem.fresh{ animation: rise 420ms var(--ease) both; }
.rowtop{ display:flex; align-items:baseline; gap:8px; }
.rowtop .lb{ flex:1; min-width:0; font-size:14px; font-weight:500; line-height:1.4; color: var(--white); }
.tagline{ display:flex; gap:6px; flex-wrap:wrap; }

/* ---------- 對象卡 ---------- */
.pcard{
  background: var(--obsid); border-radius:12px; padding:12px 16px;
  display:flex; flex-direction:column; gap:6px;
}
.pcard.fresh{ animation: rise 420ms var(--ease) both; }
.pcard .nmrow{ display:flex; align-items:center; gap:8px; }
.pcard .avatar{
  width:28px; height:28px; border-radius:9999px; background: var(--graph); flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color: var(--ash);
}
.pcard .nm{ font-size:14px; font-weight:500; line-height:1.3; color: var(--white); }
.pcard .role{ font-size:11px; line-height:1.3; color: var(--smoke); }
.pcard .tone{ font-size:13px; line-height:1.5; color: var(--ash); text-wrap:pretty; }
.pcard .note{
  font-size:13px; line-height:1.5; color: var(--smoke); text-wrap:pretty;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

.qabadge{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 4px); right:8px; z-index:99;
  font-family: var(--mono); font-size:8px; letter-spacing:1px; color: rgba(255,255,255,0.15);
  pointer-events:none;
}
</style>
</head>
<body>

<div class="screen">
  <div class="apphead">
    <i class="diamond" style="width:8px;height:8px"></i>
    <span class="ttl">知識庫</span>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="scroll" id="scroll">

    <!-- 第 1 步 · 餵入 -->
    <div class="feeder" id="feeder">
      <textarea id="feedText" rows="3" placeholder="貼上文字或連結——報價信、對話、備忘都行"></textarea>
      <div class="feedrow">
        <span class="feedhint" id="feedHint">抽出來的是草稿，你確認了才會寫入。</span>
        <button class="btn-extract" id="btnExtract">抽取</button>
      </div>
      <div class="samples">
        <span class="lb">試貼</span>
        <button class="sample" data-sample="quote">報價信</button>
        <button class="sample" data-sample="contact">對象備註</button>
        <button class="sample" data-sample="link">連結</button>
        <button class="sample" data-sample="chat">閒聊</button>
      </div>
    </div>

    <!-- 第 2 步 · 草稿區（JS 填入） -->
    <div id="draftArea" style="display:contents"></div>

    <!-- 第 3 步之後 · 列表 -->
    <div id="listArea" style="display:contents"></div>

  </div>
</div>

<span class="qabadge">幕聊 · app-settings</span>

<script>
"use strict";

function setVH(){ document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px"); }
setVH();
addEventListener("resize", setVH);
addEventListener("orientationchange", setVH);

/* ============ 既有資料（照抄 data/facts.json 與 contacts.json） ============ */
const FACTS = [
  { label:"代操服務標準報價",   tags:["報價","價格","方案","月費"], date:"2026-05-27", internal:false },
  { label:"議價底線（內部）",   tags:["報價","折扣","議價"],       date:"2026-05-27", internal:true },
  { label:"檔期合作兩版報價",   tags:["報價","方案","預算","檔期"], date:"2026-08-03", internal:false },
  { label:"A 案進度",           tags:["進度","A案","合約"],         date:"2026-09-01", internal:false },
  { label:"影片交付節奏",       tags:["交期","影片","時程"],       date:"2026-07-06", internal:false },
  { label:"頻道代營運月方案",   tags:["報價","方案","影片"],       date:"2026-07-24", internal:false },
  { label:"逐項計價表",         tags:["報價","計價","比價"],       date:"2026-07-24", internal:false },
  { label:"五月檔期成效",       tags:["成效","合作歷史","案例"],   date:"2026-06-01", internal:false },
  { label:"十週年檔期時程",     tags:["時程","檔期","死線"],       date:"2026-08-03", internal:false },
  { label:"W 品牌合作歷史",     tags:["合作歷史","窗口","影片"],   date:"2026-07-09", internal:false }
];
const CONTACTS = [
  { name:"林經理", role:"主管",               tone:"簡潔、先講結論、要具體時間",
    note:"在意時程超過在意細節。回覆一定要給明確的時間點。" },
  { name:"王先生", role:"客戶",               tone:"禮貌、給選項、不要壓迫",
    note:"價格敏感，比較過三家。給台階比給折扣有效。" },
  { name:"陳姐",   role:"品牌窗口（行銷主管）", tone:"直接、行動快；給具體選項和時段她就動",
    note:"開放式問句會石沉大海——訊息要帶具體選項與時段。" },
  { name:"凱文",   role:"老客戶（頻道經營）",   tone:"對帳的平靜：先講基準與事實、再講結論",
    note:"慢回、會用已讀不回施壓。回覆順序固定：基準→做了什麼→交付→結論。" }
];

/* ============ 試貼樣本（走完四種狀態） ============ */
const SAMPLES = {
  quote: "跟你確認 Y 方案：8 萬，含企劃、單日拍攝、基礎剪輯，不含空拍與二次修改。內部先知道就好——最低可以讓到 7 萬，但要搭配季度合作。",
  contact: "李副理今天口頭提的：他不看長訊息，重點放前三行；約時間直接給他兩個時段二選一，開放式問他有空嗎不會回。最近在追短影音企劃。",
  link: "https://example.com/pricing-2026",
  chat: "今天開會開到快吐，晚點再說"
};

/* ============================================================
   API 層 —— Brian 接後端只改這一區，畫面／狀態機／假引擎都不用動。

   接法：
   1. 把 API.base 填成後端位址，API.useMock 改 false。
   2. apiExtract() 換真 fetch 那支已經寫好；回傳形狀跟 mockExtract() 一致
      （{extracted:true, items:[...]} 或 {extracted:false, reason}），
      畫面渲染邏輯不用動。
   3. apiWriteFact()／apiWriteContact() 同理，接 PUT /facts/{id}、/contacts/{id}。

   TODO（給 Brian，交接時口頭講過的那個缺口）：
   /extract 契約寫「id 不由你產生，後端負責」，但 PUT 路由是 /facts/{id}，
   id 得由呼叫端帶在網址上——目前兩邊對不起來。這裡先用 slugTempId() 佔位，
   實際串接時看 extract 回應有沒有帶 id，或後端另開一支「配發 id」的端點，
   對齊後改掉 slugTempId() 那一行就好，其他都不用動。
   ============================================================ */
const API = {
  base: "",        // 例如 "http://192.168.1.20:3000/v1"
  useMock: true,    // 真 API 接上、現場網路確認可用後才改 false
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const slugTempId = () => "draft-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);

async function apiExtract(raw) {
  if (API.useMock) { await sleep(900); return mockExtract(raw); }
  const res = await fetch(API.base + "/extract", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: raw }),
  });
  if (!res.ok) throw new Error("extract 失敗 · HTTP " + res.status);
  return res.json();
}

async function apiWriteFact(d) {
  if (API.useMock) return d;
  const id = d.id || slugTempId();
  const body = {
    label: d.label, tags: d.tags, content: d.content,
    updatedAt: d.updatedAt, volatility: d.volatility,
    ...(d.internal ? { usage: "internal" } : {}),
  };
  const res = await fetch(API.base + "/facts/" + encodeURIComponent(id), {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("寫入事實失敗 · HTTP " + res.status);
  return res.json();
}

async function apiWriteContact(d) {
  if (API.useMock) return d;
  const id = d.id || slugTempId();
  const body = { name: d.name, role: d.role || "", tone: d.tone, notes: d.notes, recentTopics: d.recentTopics || [] };
  const res = await fetch(API.base + "/contacts/" + encodeURIComponent(id), {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("寫入對象失敗 · HTTP " + res.status);
  return res.json();
}

/* ============ 原型假引擎（規則版；真 API 接上後只有上面 apiExtract() 會呼叫到它） ============ */
const TODAY = "2026-09-03";
function mockExtract(raw) {
  const t = raw.trim();
  if (/^https?:\/\/|https?:\/\/\S+$/.test(t) && !/\s[^h]/.test(t))
    return { extracted:false, reason:"這個連結我讀不到內容，可以直接把文字貼給我" };
  if (t.length < 15 || !/[0-9０-９]|方案|報價|交期|進度|檔期|偏好|時段|不看|在意|雷點/.test(t))
    return { extracted:false, reason:"這段沒有具體的數字或條件，我抽不出可以引用的事實" };

  /* 對象備註樣態 */
  if (/不看|重點放|二選一|不會回|吃什麼語氣|偏好/.test(t) && /理|經理|窗口|先生|小姐|姐|哥/.test(t)) {
    const name = (t.match(/^([一-龥]{1,3}(?:副理|經理|協理|主任|先生|小姐))/) || [,"對象"])[1];
    return { extracted:true, items:[{
      type:"contact", name, role:"窗口",
      tone:"短訊息、重點前置；給具體時段二選一",
      notes:"不看長訊息，重點放前三行；開放式問句不會回。",
      recentTopics:["短影音企劃"]
    }]};
  }

  /* 事實樣態：含內部訊號就多抽一張 internal */
  const items = [{
    type:"fact", label:"Y 方案報價",
    tags:["報價","價格","多少錢","方案","預算"],
    content:"Y 方案 8 萬，含企劃、單日拍攝、基礎剪輯，不含空拍與二次修改。",
    updatedAt:TODAY, volatility:"high", internal:false
  }];
  if (/底線|最低|讓到|成本|利潤|內部/.test(t)) {
    items.push({
      type:"fact", label:"Y 方案底線",
      tags:["報價","折扣","議價","底線"],
      content:"Y 方案最低可讓到 7 萬，需搭配季度合作。",
      updatedAt:TODAY, volatility:"high",
      internal:true, internalReason:"這是你的讓價空間，寫進回覆等於先自砍一刀"
    });
  }
  return { extracted:true, items };
}

/* ============ 畫面 ============ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const sect = (t) => '<div class="sect"><span class="eyebrow">' + esc(t) + '</span><span class="ln"></span></div>';

let drafts = [];
let noResult = null;

function renderCount() {
  $("cnt").textContent = FACTS.length + " 條 · " + CONTACTS.length + " 人";
}

function renderList(freshCount) {
  $("listArea").innerHTML =
    sect("知識 · " + FACTS.length + " 條") +
    FACTS.map((f, i) => `
      <div class="rowitem${i < (freshCount||0) && f._fresh ? " fresh" : ""}">
        <div class="rowtop">
          <span class="lb">${esc(f.label)}</span>
          <span class="datep">${esc(f.date)}</span>
        </div>
        <div class="tagline">
          ${f.internal ? '<span class="chip amber">內部參考</span>' : ""}
          ${f.tags.map(t => '<span class="chip">' + esc(t) + '</span>').join("")}
        </div>
      </div>`).join("") +
    sect("對象檔案 · " + CONTACTS.length + " 人") +
    CONTACTS.map(c => `
      <div class="pcard${c._fresh ? " fresh" : ""}">
        <div class="nmrow">
          <span class="avatar">${esc(c.name[0])}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="role">${esc(c.role)}</span>
        </div>
        <div class="tone">${esc(c.tone)}</div>
        <div class="note">${esc(c.note)}</div>
      </div>`).join("");
  FACTS.forEach(f => delete f._fresh);
  CONTACTS.forEach(c => delete c._fresh);
  renderCount();
}

function draftCard(d, i) {
  if (d.type === "contact") return `
    <div class="draft" style="animation-delay:${i*120}ms">
      <div class="top">
        <span class="lb">${esc(d.name)}</span>
        <span class="chip ghost">對象</span>
      </div>
      <div class="content">${esc(d.tone)}／${esc(d.notes)}</div>
      <div class="tagline">${(d.recentTopics||[]).map(t => '<span class="chip">' + esc(t) + '</span>').join("")}</div>
    </div>`;
  return `
    <div class="draft${d.internal ? " internal" : ""}" data-draft="${i}" style="animation-delay:${i*120}ms">
      <div class="top">
        <span class="lb">${esc(d.label)}</span>
        ${d.internal ? '<span class="chip amber">內部</span>' : ""}
        ${d.volatility === "high" ? '<span class="chip ghost">效期短</span>' : ""}
        <span class="datep">${esc(d.updatedAt)}</span>
      </div>
      <div class="content">${esc(d.content)}</div>
      <div class="tagline">${d.tags.map(t => '<span class="chip">' + esc(t) + '</span>').join("")}</div>
      <div class="introw">
        <span class="tx">
          <span class="t1">內部參考 · 知道但不說</span>
          <span class="t2">${esc(d.internal ? (d.internalReason || "引擎讀得到，永遠不寫進回覆、不出現在來源標註。")
                                             : (d.internalReason || "目前會照常引用；打開後只供引擎判斷，不寫進回覆。"))}</span>
        </span>
        <button class="switch" role="switch" aria-checked="${d.internal}" data-toggle="${i}" aria-label="內部參考">
          <span class="knob"></span>
        </button>
      </div>
    </div>`;
}

function renderDrafts() {
  const area = $("draftArea");
  if (noResult) {
    area.innerHTML =
      sect("抽取結果") +
      `<div class="nores">
        <div class="why">${esc(noResult.reason)}</div>
        <div class="orig">${esc(noResult.orig)}</div>
        <div class="confirmrow"><button class="linkbtn" id="btnDismiss">知道了</button></div>
      </div>`;
    $("btnDismiss").addEventListener("click", () => { noResult = null; renderDrafts(); });
    return;
  }
  if (!drafts.length) { area.innerHTML = ""; return; }
  area.innerHTML =
    sect("草稿 · 確認才寫入") +
    drafts.map(draftCard).join("") +
    `<div class="confirmrow">
      <button class="btn-confirm" id="btnConfirm">確認寫入 ${drafts.length} 筆</button>
      <button class="linkbtn" id="btnDiscard">捨棄草稿</button>
    </div>`;

  area.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    const d = drafts[Number(b.dataset.toggle)];
    d.internal = !d.internal;
    renderDrafts();
  }));
  $("btnDiscard").addEventListener("click", () => { drafts = []; renderDrafts(); });
  $("btnConfirm").addEventListener("click", async () => {
    const btn = $("btnConfirm");
    btn.disabled = true;
    try {
      /* 逐筆寫入（mock 模式下這兩支直接 resolve 原值，行為跟改版前一致） */
      await Promise.all(drafts.map(d => d.type === "contact" ? apiWriteContact(d) : apiWriteFact(d)));
      drafts.slice().reverse().forEach(d => {
        if (d.type === "contact") CONTACTS.unshift({ name:d.name, role:d.role || "窗口", tone:d.tone, note:d.notes, _fresh:true });
        else FACTS.unshift({ label:d.label, tags:d.tags, date:d.updatedAt, internal:d.internal, _fresh:true });
      });
      const n = drafts.length;
      drafts = [];
      renderDrafts();
      renderList(n);
      $("feedText").value = "";
      $("feedHint").textContent = "已寫入 " + n + " 筆，回主畫面立刻能被引用。";
    } catch (err) {
      /* 真 API 上線後才可能走到這裡；mock 模式不會拋錯 */
      btn.disabled = false;
      $("feedHint").textContent = "寫入失敗，請再按一次確認（" + err.message + "）。";
    }
  });
}

/* ============ 抽取流程 ============ */
async function runExtract() {
  const raw = $("feedText").value;
  if (!raw.trim()) return;
  const feeder = $("feeder"), btn = $("btnExtract");
  drafts = []; noResult = null; renderDrafts();
  feeder.classList.add("reading");
  btn.disabled = true;
  $("feedHint").textContent = "讀取中……";
  try {
    const res = await apiExtract(raw);
    if (res.extracted) {
      drafts = res.items.map(d => ({ ...d, internal: !!(d.internal || d.usage === "internal") }));
      $("feedHint").textContent = "抽出 " + drafts.length + " 筆草稿，看過再按確認。";
    } else {
      noResult = { reason: res.reason, orig: raw.trim() };
      $("feedHint").textContent = "抽出來的是草稿，你確認了才會寫入。";
    }
  } catch (err) {
    /* 真 API 上線後才可能走到這裡；mock 模式不會拋錯 */
    noResult = { reason: "讀取失敗，請稍後再試（" + err.message + "）。", orig: raw.trim() };
    $("feedHint").textContent = "抽出來的是草稿，你確認了才會寫入。";
  } finally {
    feeder.classList.remove("reading");
    btn.disabled = false;
    renderDrafts();
  }
}

$("btnExtract").addEventListener("click", runExtract);
document.querySelectorAll(".sample").forEach(b => b.addEventListener("click", () => {
  $("feedText").value = SAMPLES[b.dataset.sample];
  runExtract();
}));

renderList(0);
renderDrafts();
</script>
</body>
</html>
