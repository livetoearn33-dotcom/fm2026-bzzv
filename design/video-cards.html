<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幕僚 · 影片字卡 — 鉤子＋片頭＋片尾（定案版）</title>
<link rel="stylesheet" href="fonts/fonts.css"><!-- 本機字型，離線可跑 -->
<style>
/* ============================================================
   幕僚 · 影片字卡（≤2 分鐘介紹影片素材，螢幕錄影用）
   五段直向排列，捲到哪段就自動播那段；點畫面重播；按 1-5 跳段。
   滑鼠不動 2.5 秒後所有輔助文字自動隱藏——錄影時畫面上只有素材。

   段落（2026-09-03 Zeno 定案收斂：片頭用 B 生長字卡；
   　　　A 極簡菱形淘汰；C 面板升起挪去 slides-template.html 當簡報封面）：
     1 鉤子 · 通知轟炸 → 黑場出字
     2 片頭 · 生長字卡
     3 片尾 · 菱形版隊名

   設計語言沿用 refined.html：#040506 canvas、珊瑚菱形只當品牌標記、
   expo-out 轉場、不彈跳、不發光、不漸層。
   ============================================================ */

:root{
  --void:  #040506;
  --ink:   #07080a;
  --obsid: #111214;
  --graph: #1b1c1e;
  --slate: #363739;
  --iron:  #454647;
  --smoke: #6a6b6c;
  --ash:   #9c9c9d;
  --mist:  #e6e6e6;
  --white: #ffffff;
  --coral: #ff6363;
  --host-bg:   #f2f2f3;
  --host-card: #ffffff;
  --host-line: #dfdfe0;
  --host-ink:  #1b1c1e;
  --keyline-soft: rgba(255,255,255,0.05) 0 1px 0 0 inset,
                  rgba(255,255,255,0.14) 0 0 0 1px,
                  rgba(0,0,0,0.20) 0 -1px 0 0 inset;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, monospace;
}

*{ box-sizing: border-box; }
html,body{ margin:0; }
html{ scroll-snap-type: y mandatory; }
body{
  background: var(--void); color: var(--white);
  font-family: "Noto Sans TC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.stage{
  position:relative; width:100vw; height:100vh; overflow:hidden;
  scroll-snap-align:start; cursor:default;
  display:flex; align-items:center; justify-content:center;
}

/* 錄影時要消失的輔助層：滑鼠不動 2.5 秒自動隱藏 */
.chrome{
  position:fixed; left:0; right:0; bottom:16px; z-index:9;
  display:flex; justify-content:center; pointer-events:none;
  transition: opacity 300ms var(--ease);
}
body.quiet .chrome{ opacity:0; }
.chrome .bar{
  font-family: var(--mono); font-size:10px; letter-spacing:.8px; text-transform:uppercase;
  color: var(--smoke); background: var(--ink); border-radius:8px; padding:8px 12px;
  box-shadow: rgba(255,255,255,0.14) 0 0 0 1px;
}

.diamond{ background: var(--coral); transform: rotate(45deg); flex:none; }
.eyebrow{
  font-family: var(--mono); font-size:13px; line-height:1;
  letter-spacing:4px; text-transform:uppercase; color: var(--smoke);
}

/* ---------- 1 · 鉤子：通知轟炸 ---------- */
#hookRain{ position:absolute; inset:0; background: var(--host-bg); }
.notif{
  position:absolute; width:340px; border-radius:8px;
  background: var(--host-card); border:1px solid var(--host-line);
  padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
  opacity:0; transform: scale(0.96) rotate(var(--r, 0deg));
}
.notif.in{ opacity:1; transform: scale(1) rotate(var(--r, 0deg)); transition: opacity 150ms var(--ease), transform 150ms var(--ease); }
.notif .av{ width:28px; height:28px; border-radius:9999px; background: var(--host-line); flex:none; }
.notif .tx{ flex:1; min-width:0; }
.notif .t1{ display:flex; align-items:baseline; gap:8px; }
.notif .nm{ font-size:13px; font-weight:500; color: var(--host-ink); }
.notif .app{ font-family: var(--mono); font-size:10px; letter-spacing:.3px; color: var(--smoke); margin-left:auto; }
.notif .msg{
  font-size:12px; line-height:1.5; color: var(--iron); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* 主角通知：轟炸最後一張，置中放大、停一拍讓觀眾讀完再硬切黑場 */
.notif.hero{
  width:420px; left:50% !important; top:50% !important;
  transform: translate(-50%,-50%) scale(0.96) rotate(0deg) !important;
  border-color: var(--iron); z-index:2;
}
.notif.hero.in{ transform: translate(-50%,-50%) scale(1) rotate(0deg) !important; }
.notif.hero .nm{ font-size:15px; }
.notif.hero .msg{ font-size:14px; color: var(--host-ink); }
#hookDark{ position:absolute; inset:0; background: var(--void); opacity:0; }
#hookDark.on{ opacity:1; }
.hookline{
  position:absolute; left:0; right:0; text-align:center;
  opacity:0; transform: translateY(8px);
  transition: opacity 400ms var(--ease), transform 400ms var(--ease);
}
.hookline.in{ opacity:1; transform: translateY(0); }
#hl1{ top:42%; font-size:40px; font-weight:400; line-height:1.4; color: var(--white); }
#hl2{ top:56%; font-size:15px; color: var(--smoke); }

/* ---------- 片頭共用 ----------
   質感三件套（都是產品裡已有的語彙，不加新色不加漸層特效）：
   1. 髮絲線從中心拉開＋掃一道光（讀取中的簽名動作）
   2. 品牌字分字進場（120ms 錯拍）
   3. 眉標字距從 8px 收攏到 4px（落定感） */
.titlewrap{ display:flex; flex-direction:column; align-items:center; gap:24px; }
.brandbig{ font-size:112px; font-weight:300; line-height:1.1; letter-spacing:16px; text-indent:16px; color: var(--white); }
.brandbig .ch{
  display:inline-block; opacity:0; transform: translateY(20px);
  transition: opacity 600ms var(--ease), transform 600ms var(--ease);
}
.brandbig.in .ch{ opacity:1; transform:none; }
.brandbig.in .ch:nth-child(2){ transition-delay:120ms; }
.tagline{ font-size:18px; line-height:1.7; color: var(--ash); text-wrap:pretty; text-align:center; }
.fadein{ opacity:0; transform: translateY(8px); transition: opacity 500ms var(--ease), transform 500ms var(--ease), letter-spacing 900ms var(--ease); }
.fadein.in{ opacity:1; transform: translateY(0); }
.eyebrow.fadein{ letter-spacing:8px; }
.eyebrow.fadein.in{ letter-spacing:4px; }

.rule{
  position:relative; height:1px; width:min(640px, 64vw); overflow:hidden;
  background: rgba(255,255,255,0.12);
  transform: scaleX(0); transition: transform 700ms var(--ease);
}
.rule.in{ transform: scaleX(1); }
.rule::after{
  content:''; position:absolute; left:0; top:0; height:1px; width:28%; opacity:0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
}
.rule.in::after{ animation: sweep-once 900ms linear 350ms both; }
@keyframes sweep-once{ from{ transform:translateX(-100%); opacity:1 } to{ transform:translateX(460%); opacity:1 } }

/* 片頭 · 生長字卡 */
#typeLine{ font-size:20px; line-height:1.7; color: var(--mist); min-height:34px; text-align:center; }
.caret{ display:inline-block; width:2px; height:22px; background: var(--iron); margin-left:3px; vertical-align:-4px; }

/* ---------- 5 · 片尾 ---------- */
.endwrap{ display:flex; flex-direction:column; align-items:center; gap:20px; }
.endbrand{ display:flex; align-items:center; gap:12px; }
.teamname{ font-size:44px; font-weight:300; line-height:1.4; letter-spacing:4px; text-indent:4px; color: var(--white); }
.endmono{ font-family: var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color: var(--smoke); }

/* ============================================================
   質感三層（2026-09-03 Zeno 裁定 A+B+C 全疊，五檔統一）
   刻度與中繼資料是影片畫框語言的一部分，錄影時保留。
   ============================================================ */
body{
  background: radial-gradient(ellipse 120% 90% at 50% 40%, #0b0c0e 0%, var(--void) 55%) fixed;
}
body::before{
  content:''; position:fixed; inset:0; z-index:55; pointer-events:none;
  background: radial-gradient(ellipse 92% 80% at 50% 46%, transparent 58%, rgba(0,0,0,0.42) 100%);
}
body::after{
  content:''; position:fixed; inset:0; z-index:56; pointer-events:none; opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.16'/></svg>");
}
.qtick{ position:fixed; width:14px; height:14px; border:0 solid var(--slate); z-index:57; pointer-events:none; }
.qtick.tl{ left:20px; top:20px; border-left-width:1px; border-top-width:1px; }
.qtick.tr{ right:20px; top:20px; border-right-width:1px; border-top-width:1px; }
.qtick.bl{ left:20px; bottom:20px; border-left-width:1px; border-bottom-width:1px; }
.qtick.br{ right:20px; bottom:20px; border-right-width:1px; border-bottom-width:1px; }
.qmeta{
  position:fixed; z-index:57; pointer-events:none;
  font-family: var(--mono); font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color: var(--iron);
}
.qmeta.tl{ left:44px; top:23px; }
.qmeta.br{ right:44px; bottom:23px; }
</style>
</head>
<body>
<i class="qtick tl"></i><i class="qtick tr"></i><i class="qtick bl"></i><i class="qtick br"></i>
<span class="qmeta tl">幕僚 · Chief of Staff</span>
<span class="qmeta br">Future of Work</span>

<!-- ============ 1 · 鉤子：通知轟炸 ============ -->
<section class="stage" id="s1" data-name="1 · 鉤子 通知轟炸 → 黑場">
  <div id="hookRain"></div>
  <div id="hookDark">
    <div class="hookline" id="hl1">不是我不想回，是我怕回錯。</div>
    <div class="hookline" id="hl2">每拖一小時，就有一個案子在冷掉。</div>
  </div>
</section>

<!-- ============ 2 · 片頭：生長字卡（定案） ============ -->
<section class="stage" id="s2" data-name="2 · 片頭 生長字卡">
  <div class="titlewrap">
    <div class="brandbig" id="brandB"><span class="ch">幕</span><span class="ch">僚</span></div>
    <div class="eyebrow fadein" id="eyeB">Chief of Staff</div>
    <div class="rule" id="ruleB"></div>
    <div id="typeLine"><span id="typeTx"></span><span class="caret" id="typeCaret"></span></div>
  </div>
</section>

<!-- ============ 3 · 片尾：菱形版隊名（定案） ============ -->
<section class="stage" id="s3" data-name="3 · 片尾 菱形版隊名">
  <div class="endwrap">
    <div class="endbrand fadein" id="endBrand">
      <i class="diamond" style="width:10px;height:10px"></i>
      <span class="eyebrow" style="font-size:11px;letter-spacing:2px">幕僚 · Chief of Staff</span>
    </div>
    <div class="teamname fadein" id="endTeam">全村的希望就是真真</div>
    <div class="rule" id="ruleEnd"></div>
    <div class="endmono fadein" id="endMeta">Futuremode × SITCON Buildmode 2026 · Future of Work</div>
    <div class="endmono fadein" id="endRepo" style="text-transform:none">github.com/livetoearn33-dotcom/fm2026-bzzv</div>
  </div>
</section>

<div class="chrome"><div class="bar" id="chromeBar">點畫面重播 · 按 1-3 跳段 · 滑鼠停 2.5 秒輔助字自動隱藏</div></div>

<script>
"use strict";

/* ---------- 通知池：demo 世界觀裡的真實工作訊息 ---------- */
const NOTIFS = [
  ["林經理", "LINE", "這個進度到底怎麼樣了？"],
  ["林經理", "LINE", "下午要跟客戶開會。"],
  ["王先生", "LINE", "這個價格比別家貴很多耶。"],
  ["王先生", "LINE", "報價單今天能給嗎？"],
  ["陳姐",   "LINE", "上次說的企劃好了嗎？這週能約個時段嗎"],
  ["凱文",   "LINE", "這個月的結算數字我看不太懂"],
  ["專案群組", "Lark", "@你 明天提案誰負責？"],
  ["專案群組", "Lark", "會議改到 14:00，資料麻煩會前丟上來"],
  ["業務部",  "Lark", "Q3 數字今天下班前要"],
  ["客戶窗口", "Gmail", "Re: 合約範圍確認——再麻煩回覆"],
  ["客戶窗口", "Gmail", "Re: Re: 報價單（第 3 次寄送）"],
  ["主辦單位", "Gmail", "出席確認回條尚未收到"]
];

const timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearAll = () => { while (timers.length) clearTimeout(timers.pop()); };
const $ = (id) => document.getElementById(id);

/* ---------- 段 1：通知轟炸 → 主角通知 → 黑場出字 ----------
   壓到 6.5s（2:00 影片的鉤子不該超過 7s）：
   0–3.9s 通知從每 420ms 加速到每 55ms、疊到蓋滿；
   3.9s 主角通知（第 3 次寄送）置中放大，停 0.55s 讓人讀完；
   4.6s 硬切黑場（不淡出——「突然靜音」就是要硬切）；
   5.2s 主句、6.0s 副句。 */
const HERO_NOTIF = ["客戶窗口", "Gmail", "Re: Re: 報價單（第 3 次寄送）"];

function makeNotif(nm, app, msg, hero) {
  const el = document.createElement("div");
  el.className = hero ? "notif hero" : "notif";
  if (!hero) {
    el.style.left = (4 + Math.random() * (innerWidth - 356)) + "px";
    el.style.top  = (4 + Math.random() * (innerHeight - 84)) + "px";
    el.style.setProperty("--r", (Math.random() * 5 - 2.5).toFixed(1) + "deg");
  }
  el.innerHTML =
    '<div class="av"></div><div class="tx"><div class="t1"><span class="nm">' + nm +
    '</span><span class="app">' + app + '</span></div><div class="msg">' + msg + '</div></div>';
  return el;
}

function playHook() {
  const rain = $("hookRain"), dark = $("hookDark");
  rain.innerHTML = ""; rain.style.display = "";
  dark.classList.remove("on");
  $("hl1").classList.remove("in"); $("hl2").classList.remove("in");

  let t = 250, gap = 420, i = 0;
  while (t < 3900) {
    const delay = t;
    later(() => {
      const [nm, app, msg] = NOTIFS[i++ % NOTIFS.length];
      const el = makeNotif(nm, app, msg, false);
      rain.appendChild(el);
      requestAnimationFrame(() => el.classList.add("in"));
    }, delay);
    t += gap;
    gap = Math.max(55, gap * 0.84);
  }
  later(() => {
    const el = makeNotif(HERO_NOTIF[0], HERO_NOTIF[1], HERO_NOTIF[2], true);
    rain.appendChild(el);
    requestAnimationFrame(() => el.classList.add("in"));
  }, 3900);
  later(() => { rain.style.display = "none"; dark.classList.add("on"); }, 4600);
  later(() => $("hl1").classList.add("in"), 5200);
  later(() => $("hl2").classList.add("in"), 6000);
}

/* ---------- 段 2：生長字卡。名先立，定位句逐字長出（同第一幕的文字生長） ---------- */
const TYPE_LINE = "你收到工作訊息，點一下，它照著你自己的資料把回覆寫好。";
function playB() {
  ["brandB","eyeB","ruleB"].forEach(id => $(id).classList.remove("in"));
  $("typeTx").textContent = "";
  later(() => $("brandB").classList.add("in"), 300);
  later(() => $("eyeB").classList.add("in"), 700);
  later(() => $("ruleB").classList.add("in"), 950);
  TYPE_LINE.split("").forEach((ch, i) => {
    later(() => { $("typeTx").textContent += ch; }, 1700 + i * 65);
  });
}

/* ---------- 段 3：片尾 ---------- */
function playEnd() {
  ["endBrand","endTeam","ruleEnd","endMeta","endRepo"].forEach(id => $(id).classList.remove("in"));
  later(() => $("endBrand").classList.add("in"), 300);
  later(() => $("endTeam").classList.add("in"), 700);
  later(() => $("ruleEnd").classList.add("in"), 1000);
  later(() => $("endMeta").classList.add("in"), 1300);
  later(() => $("endRepo").classList.add("in"), 1600);
}

const PLAYERS = { s1: playHook, s2: playB, s3: playEnd };

function play(id) {
  clearAll();
  $("chromeBar").textContent = document.querySelector("#" + id).dataset.name + " — 點畫面重播 · 按 1-5 跳段";
  PLAYERS[id]();
}

/* 捲到哪段就播哪段（不用 IntersectionObserver，WebView 相容性較穩） */
let current = "", scrollTimer = null;
function checkSection() {
  const mid = scrollY + innerHeight / 2;
  let hit = null;
  document.querySelectorAll(".stage").forEach(s => {
    if (s.offsetTop <= mid && mid < s.offsetTop + s.offsetHeight) hit = s.id;
  });
  if (hit && hit !== current) { current = hit; play(hit); }
}
addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(checkSection, 120);
});
document.querySelectorAll(".stage").forEach(s => {
  s.addEventListener("click", () => play(s.id));
});
checkSection();

/* 按 1-3 跳段 */
addEventListener("keydown", e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 3) document.querySelector("#s" + n).scrollIntoView({ behavior: "instant", block: "start" });
});

/* 滑鼠不動 2.5 秒 → 隱藏輔助層（錄影乾淨） */
let quietTimer = null;
function poke() {
  document.body.classList.remove("quiet");
  clearTimeout(quietTimer);
  quietTimer = setTimeout(() => document.body.classList.add("quiet"), 2500);
}
addEventListener("mousemove", poke);
poke();
</script>
</body>
</html>
