<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幕聊 · 知識庫（WebView 正式版）</title>
<link rel="stylesheet" href="fonts/fonts.css"><!-- 本機字型，離線可跑 -->
<style>
/* ============================================================
   幕聊 · 知識庫設定頁 —— WebView 正式版
   以 settings-page.html 互動版（2026-09-03 19:42）為準重做：
   貼上 → 抽取草稿（含 internal 開關）→ 確認寫入 → 列表列承接。
   全螢幕、safe-area、tap target ≥ 44dp。
   這份檔案是「要放進 Android WebView 的東西」，不是設計稿。
   ============================================================ */

:root{
  --void:  #040506;
  --ink:   #07080a;
  --obsid: #111214;
  --graph: #1b1c1e;
  --slate: #363739;
  --iron:  #454647;
  --smoke: #6a6b6c;
  --ash:   #9c9c9d;
  --mist:  #e6e6e6;
  --white: #ffffff;
  --coral: #ff6363;
  --ember: #452324;
  --amber: #4a3a1f;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, monospace;
  --vh: 1vh;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; height:100%; overscroll-behavior: none; }
body{
  height: calc(var(--vh, 1vh) * 100);
  background: var(--void); color: var(--white);
  font-family: "Noto Sans TC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button{ font-family: inherit; cursor: pointer; }

.screen{
  position:relative; width:100%; height:100%;
  display:flex; flex-direction:column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.apphead{
  flex:none; display:flex; align-items:center; gap:8px; padding:12px 16px 8px;
}
.backchev{
  width:44px; height:44px; margin-left:-12px; flex:none; border:0; background:transparent;
  display:flex; align-items:center; justify-content:center; color: var(--smoke); font-size:20px; font-weight:300;
}
.diamond{ background: var(--coral); transform: rotate(45deg); flex:none; }
.apphead .ttl{ font-size:14px; font-weight:500; line-height:1.3; color: var(--white); }
.apphead .cnt{ margin-left:auto; font-family: var(--mono); font-size:10px; letter-spacing:.3px; color: var(--smoke); }
.scroll{
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:8px 16px; padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; gap:8px;
}
.scroll::-webkit-scrollbar{ width:0; }

.sect{ display:flex; align-items:center; gap:8px; padding:16px 0 4px; }
.eyebrow{
  font-family: var(--mono); font-size:10px; line-height:1;
  letter-spacing:.8px; text-transform:uppercase; color: var(--smoke);
}
.sect .ln{ flex:1; height:1px; background: rgba(255,255,255,0.06); }

.chip{
  font-family: var(--mono); font-size:10px; line-height:1.6; letter-spacing:.3px;
  border-radius:6px; padding:3px 6px; white-space:nowrap;
  background: var(--graph); color: var(--ash); font-variant-numeric: tabular-nums;
}
.chip.amber{ background: var(--amber); color: var(--mist); box-shadow: rgba(255,255,255,0.06) 0 0 0 1px inset; }
.chip.ghost{ background:transparent; border:1px solid var(--slate); }
.datep{ font-family: var(--mono); font-size:10px; letter-spacing:.3px; color: var(--smoke); white-space:nowrap; }

/* ---------- 第 1 步 · 餵入區（單一加入口） ---------- */
.feeder{
  position:relative; background: var(--obsid); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:12px; overflow:hidden;
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
}
.feeder::before{
  content:''; position:absolute; left:0; top:0; height:1px; width:35%; opacity:0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
}
.feeder.reading::before{ opacity:1; animation: sweep 900ms linear infinite; }
@keyframes sweep{ from{ transform: translateX(-100%) } to{ transform: translateX(286%) } }
.feeder textarea{
  width:100%; min-height:80px; resize:none; border:0; outline:0;
  background: var(--ink); border-radius:8px; padding:12px;
  font-family: inherit; font-size:15px; line-height:1.6; color: var(--mist);
  box-shadow: rgba(255,255,255,0.06) 0 0 0 1px inset;
}
.feeder textarea::placeholder{ color: var(--smoke); }
.feedrow{ display:flex; align-items:center; gap:8px; }
.feedhint{ flex:1; font-size:12px; line-height:1.5; color: var(--smoke); }
.btn-extract{
  flex:none; height:44px; min-width:44px; padding:0 18px; border-radius:8px; border:0;
  background: var(--mist); color: var(--iron); font-size:14px; font-weight:500;
  box-shadow: rgba(255,255,255,0.85) 0 1px 0 0 inset, rgba(0,0,0,0.30) 0 -1.5px 0 0 inset;
  transition: transform 110ms var(--ease), background 110ms var(--ease), opacity 150ms var(--ease);
}
.btn-extract:active{ transform: translateY(1px) scale(0.98); background: var(--white); }
.btn-extract:disabled{ opacity:.4; cursor:default; }
.samples{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.samples .lb{ font-family: var(--mono); font-size:9px; letter-spacing:.8px; text-transform:uppercase; color: var(--iron); }
.sample{
  font-size:12px; line-height:1; padding:10px 12px; border-radius:8px;
  background:transparent; color: var(--ash); border:1px solid var(--slate);
}

/* ---------- 第 2 步 · 草稿卡（主角：internal 開關） ---------- */
.draft{
  background: var(--obsid); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:10px;
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
  transition: box-shadow 200ms var(--ease);
  animation: rise 420ms var(--ease) both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
.draft.internal{
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset, 0 0 0 1px var(--amber);
}
.draft .top{ display:flex; align-items:baseline; gap:8px; }
.draft .lb{ flex:1; min-width:0; font-size:14px; font-weight:500; line-height:1.4; color: var(--white); }
.draft .content{ font-size:13px; line-height:1.6; color: var(--ash); text-wrap:pretty; }
.draft .tagline{ display:flex; gap:6px; flex-wrap:wrap; }
.introw{
  display:flex; align-items:center; gap:12px;
  margin-top:2px; padding-top:12px;
  box-shadow: rgba(255,255,255,0.05) 0 1px 0 0 inset;
}
.introw .tx{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.introw .t1{
  font-size:12px; font-weight:500; line-height:1.4; color: var(--smoke);
  transition: color 200ms var(--ease);
}
.draft.internal .introw .t1{ color: var(--mist); }
.introw .t2{ font-size:12px; line-height:1.5; color: var(--smoke); text-wrap:pretty; }
.switch{
  flex:none; width:46px; height:26px; border-radius:9999px; border:0; padding:2px;
  background: var(--graph); display:flex; justify-content:flex-start;
  box-shadow: rgba(0,0,0,0.30) 0 1px 2px 0 inset;
  transition: background 200ms var(--ease);
}
.switch .knob{
  width:22px; height:22px; border-radius:9999px; background: var(--iron);
  transition: transform 200ms var(--ease), background 200ms var(--ease);
}
.switch[aria-checked="true"]{ background: var(--amber); }
.switch[aria-checked="true"] .knob{ transform: translateX(20px); background: var(--mist); }
.confirmrow{ display:flex; align-items:center; gap:12px; padding-top:4px; }
.btn-confirm{
  flex:1; height:44px; border-radius:8px; border:0;
  background: var(--mist); color: var(--iron); font-size:14px; font-weight:500;
  box-shadow: rgba(255,255,255,0.85) 0 1px 0 0 inset, rgba(0,0,0,0.30) 0 -1.5px 0 0 inset;
  transition: transform 110ms var(--ease), background 110ms var(--ease), opacity 150ms var(--ease);
}
.btn-confirm:active{ transform: translateY(1px) scale(0.99); background: var(--white); }
.btn-confirm:disabled{ opacity:.4; cursor:default; }
.linkbtn{
  flex:none; border:0; background:transparent; padding:12px 4px; min-height:44px;
  font-family: var(--mono); font-size:10px; letter-spacing:.3px; line-height:1.6; color: var(--smoke);
}
/* 抽不到／連線問題：安靜的說明卡，不是錯誤 */
.nores{
  background: var(--obsid); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:10px;
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
  animation: rise 420ms var(--ease) both;
}
.nores .why{ font-size:14px; line-height:1.6; color: var(--mist); text-wrap:pretty; }
.nores .orig{
  background: var(--ink); border-radius:8px; padding:12px;
  font-size:13px; line-height:1.6; color: var(--smoke); white-space:pre-wrap;
  box-shadow: rgba(255,255,255,0.05) 0 0 0 1px inset;
}

/* ---------- 第 3 步之後 · 列表列（定案 A） ---------- */
.rowitem{ display:flex; flex-direction:column; gap:6px; padding:12px 0; }
.rowitem.fresh{ animation: rise 420ms var(--ease) both; }
.rowtop{ display:flex; align-items:baseline; gap:8px; }
.rowtop .lb{ flex:1; min-width:0; font-size:14px; font-weight:500; line-height:1.4; color: var(--white); }
.tagline{ display:flex; gap:6px; flex-wrap:wrap; }

/* ---------- 對象卡 ---------- */
.pcard{
  background: var(--obsid); border-radius:12px; padding:12px 16px;
  display:flex; flex-direction:column; gap:6px;
}
.pcard.fresh{ animation: rise 420ms var(--ease) both; }
.pcard .nmrow{ display:flex; align-items:center; gap:8px; }
.pcard .avatar{
  width:28px; height:28px; border-radius:9999px; background: var(--graph); flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color: var(--ash);
}
.pcard .nm{ font-size:14px; font-weight:500; line-height:1.3; color: var(--white); }
.pcard .role{ font-size:11px; line-height:1.3; color: var(--smoke); }
.pcard .tone{ font-size:13px; line-height:1.5; color: var(--ash); text-wrap:pretty; }
.pcard .note{
  font-size:13px; line-height:1.5; color: var(--smoke); text-wrap:pretty;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ---------- 開發用：QA 角標 ---------- */
.qabadge{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 4px); right:8px; z-index:99;
  font-family: var(--mono); font-size:8px; letter-spacing:1px; color: rgba(255,255,255,0.14);
  pointer-events:none;
}
</style>
</head>
<body>

<div class="screen">
  <div class="apphead">
    <button class="backchev" id="backBtn">‹</button>
    <i class="diamond" style="width:8px;height:8px"></i>
    <span class="ttl">知識庫</span>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="scroll" id="scroll">

    <div class="feeder" id="feeder">
      <textarea id="feedText" rows="3" placeholder="貼上文字或連結——報價信、對話、備忘都行"></textarea>
      <div class="feedrow">
        <span class="feedhint" id="feedHint">抽出來的是草稿，你確認了才會寫入。</span>
        <button class="btn-extract" id="btnExtract">抽取</button>
      </div>
      <div class="samples" id="samples" hidden>
        <span class="lb">試貼</span>
        <button class="sample" data-sample="quote">報價信</button>
        <button class="sample" data-sample="contact">對象備註</button>
        <button class="sample" data-sample="link">連結</button>
        <button class="sample" data-sample="chat">閒聊</button>
      </div>
    </div>

    <div id="draftArea" style="display:contents"></div>
    <div id="listArea" style="display:contents"></div>

  </div>
</div>

<span class="qabadge">幕聊 · app-settings</span>

<script>
"use strict";

function setVH(){ document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px"); }
setVH();
addEventListener("resize", setVH);
addEventListener("orientationchange", setVH);

/* ============================================================
   JS Bridge（照 docs/js-bridge契約.md）
   原生 → 網頁：EQ.renderList({facts,contacts})、EQ.renderDrafts(res)、
   　　　　　　　EQ.saved(count)、EQ.error(code)
   網頁 → 原生：EQNative.extract(input, kind)、EQNative.confirm(itemsJson)、
   　　　　　　　EQNative.back()
   - internal 開關狀態以網頁送回的為準（使用者可能改過 LLM 判定）
   - internalReason 只給人看，confirm 前已丟棄，不進資料庫
   - extracted:false 顯示 reason 原文，不改寫
   沒有原生環境 → 檔尾 mock 區塊接手（含試貼四鍵），雙擊 HTML 走完整流程。
   ============================================================ */

const BRIDGED = !!window.EQNative;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const sect = (t) => '<div class="sect"><span class="eyebrow">' + esc(t) + '</span><span class="ln"></span></div>';

let FACTS = [];       // EQ.renderList 餵進來
let CONTACTS = [];
let drafts = [];      // 目前草稿（含使用者改過的 internal 狀態）
let noResult = null;  // { reason, orig }
let pendingConfirm = null;

/* ---------- 原生打進來的介面 ---------- */
window.EQ = {
  renderList(data) {
    FACTS = (data.facts || []).map(f => ({
      label: f.label, tags: f.tags || [], date: f.updatedAt || "",
      internal: f.usage === "internal"
    }));
    CONTACTS = (data.contacts || []).map(c => ({
      name: c.name, role: c.role || "", tone: c.tone || "", note: c.notes || c.note || ""
    }));
    renderList();
  },
  renderDrafts(res) {
    $("feeder").classList.remove("reading");
    $("btnExtract").disabled = false;
    if (res && res.extracted) {
      drafts = (res.items || []).slice(0, 3).map(d => ({ ...d, internal: !!(d.usage === "internal" || d.internal) }));
      noResult = null;
      $("feedHint").textContent = "抽出 " + drafts.length + " 筆草稿，看過再按確認。";
    } else {
      drafts = [];
      noResult = { reason: (res && res.reason) || "抽取沒有成功，再試一次。", orig: $("feedText").value.trim() };
      $("feedHint").textContent = "抽出來的是草稿，你確認了才會寫入。";
    }
    renderDrafts();
  },
  saved(count) {
    const items = pendingConfirm || [];
    pendingConfirm = null;
    items.slice().reverse().forEach(d => {
      if (d.type === "contact") CONTACTS.unshift({ name: d.name, role: d.role || "窗口", tone: d.tone, note: d.notes, _fresh: true });
      else FACTS.unshift({ label: d.label, tags: d.tags, date: d.updatedAt, internal: d.usage === "internal", _fresh: true });
    });
    drafts = [];
    renderDrafts();
    renderList();
    $("feedText").value = "";
    $("feedHint").textContent = "已寫入 " + count + " 筆，回主畫面立刻能被引用。";
  },
  error(code) {
    $("feeder").classList.remove("reading");
    $("btnExtract").disabled = false;
    const btn = $("draftArea").querySelector(".btn-confirm");
    if (btn) btn.disabled = false;
    pendingConfirm = null;
    $("feedHint").textContent = code === "network"
      ? "連線不順——內容都還在，稍等再按一次。"
      : "引擎那邊出了狀況——內容都還在，稍等再按一次。";
  }
};

/* ---------- 畫面 ---------- */
function renderCount() {
  $("cnt").textContent = FACTS.length + " 條 · " + CONTACTS.length + " 人";
}

function renderList() {
  $("listArea").innerHTML =
    sect("知識 · " + FACTS.length + " 條") +
    FACTS.map(f => `
      <div class="rowitem${f._fresh ? " fresh" : ""}">
        <div class="rowtop">
          <span class="lb">${esc(f.label)}</span>
          <span class="datep">${esc(f.date)}</span>
        </div>
        <div class="tagline">
          ${f.internal ? '<span class="chip amber">內部參考</span>' : ""}
          ${f.tags.map(t => '<span class="chip">' + esc(t) + '</span>').join("")}
        </div>
      </div>`).join("") +
    sect("對象檔案 · " + CONTACTS.length + " 人") +
    CONTACTS.map(c => `
      <div class="pcard${c._fresh ? " fresh" : ""}">
        <div class="nmrow">
          <span class="avatar">${esc((c.name || "？")[0])}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="role">${esc(c.role)}</span>
        </div>
        <div class="tone">${esc(c.tone)}</div>
        <div class="note">${esc(c.note)}</div>
      </div>`).join("");
  FACTS.forEach(f => delete f._fresh);
  CONTACTS.forEach(c => delete c._fresh);
  renderCount();
}

function draftCard(d, i) {
  if (d.type === "contact") return `
    <div class="draft" style="animation-delay:${i * 120}ms">
      <div class="top">
        <span class="lb">${esc(d.name)}</span>
        <span class="chip ghost">對象</span>
      </div>
      <div class="content">${esc(d.tone)}／${esc(d.notes)}</div>
      <div class="tagline">${(d.recentTopics || []).map(t => '<span class="chip">' + esc(t) + '</span>').join("")}</div>
    </div>`;
  return `
    <div class="draft${d.internal ? " internal" : ""}" style="animation-delay:${i * 120}ms">
      <div class="top">
        <span class="lb">${esc(d.label)}</span>
        ${d.internal ? '<span class="chip amber">內部</span>' : ""}
        ${d.volatility === "high" ? '<span class="chip ghost">效期短</span>' : ""}
        <span class="datep">${esc(d.updatedAt || "")}</span>
      </div>
      <div class="content">${esc(d.content)}</div>
      <div class="tagline">${(d.tags || []).map(t => '<span class="chip">' + esc(t) + '</span>').join("")}</div>
      <div class="introw">
        <span class="tx">
          <span class="t1">內部參考 · 知道但不說</span>
          <span class="t2">${esc(d.internal ? (d.internalReason || "引擎讀得到，永遠不寫進回覆、不出現在來源標註。")
                                             : "目前會照常引用；打開後只供引擎判斷，不寫進回覆。")}</span>
        </span>
        <button class="switch" role="switch" aria-checked="${d.internal}" data-toggle="${i}" aria-label="內部參考">
          <span class="knob"></span>
        </button>
      </div>
    </div>`;
}

function renderDrafts() {
  const area = $("draftArea");
  if (noResult) {
    area.innerHTML =
      sect("抽取結果") +
      `<div class="nores">
        <div class="why">${esc(noResult.reason)}</div>
        <div class="orig">${esc(noResult.orig)}</div>
        <div class="confirmrow"><button class="linkbtn" id="btnDismiss">知道了</button></div>
      </div>`;
    $("btnDismiss").addEventListener("click", () => { noResult = null; renderDrafts(); });
    return;
  }
  if (!drafts.length) { area.innerHTML = ""; return; }
  area.innerHTML =
    sect("草稿 · 確認才寫入") +
    drafts.map(draftCard).join("") +
    `<div class="confirmrow">
      <button class="btn-confirm" id="btnConfirm">確認寫入 ${drafts.length} 筆</button>
      <button class="linkbtn" id="btnDiscard">捨棄草稿</button>
    </div>`;

  area.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", () => {
    const d = drafts[Number(b.dataset.toggle)];
    d.internal = !d.internal;
    renderDrafts();
  }));
  $("btnDiscard").addEventListener("click", () => { drafts = []; renderDrafts(); });
  $("btnConfirm").addEventListener("click", () => {
    /* internal 以開關現況為準；internalReason 丟棄，不進資料庫 */
    const items = drafts.map(d => {
      if (d.type === "contact")
        return { type: "contact", name: d.name, role: d.role || "", tone: d.tone, notes: d.notes, recentTopics: d.recentTopics || [] };
      const it = { type: "fact", label: d.label, tags: d.tags, content: d.content, updatedAt: d.updatedAt, volatility: d.volatility };
      if (d.internal) it.usage = "internal";
      return it;
    });
    pendingConfirm = items;
    $("btnConfirm").disabled = true;
    window.EQNative.confirm(JSON.stringify(items));
  });
}

/* ---------- 抽取 ---------- */
function runExtract() {
  const raw = $("feedText").value.trim();
  if (!raw) return;
  const kind = /^https?:\/\/\S+$/.test(raw) ? "url" : "text";
  drafts = []; noResult = null; renderDrafts();
  $("feeder").classList.add("reading");
  $("btnExtract").disabled = true;
  $("feedHint").textContent = "讀取中……";
  window.EQNative.extract(raw, kind);
}
$("btnExtract").addEventListener("click", runExtract);
$("backBtn").addEventListener("click", () => window.EQNative.back());

/* ============================================================
   Mock 區塊（契約規定內建，不要刪）：
   沒有原生環境就退回內建假資料——雙擊 HTML 走完整流程，
   含試貼四鍵（報價信／對象備註／連結讀不到／閒聊抽不到）。
   QA：?err=network 看寫入失敗路徑。
   ============================================================ */
if (!window.EQNative) {
