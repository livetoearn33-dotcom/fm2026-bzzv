<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幕聊 · 防自爆（WebView 正式版）</title>
<link rel="stylesheet" href="fonts/fonts.css"><!-- 本機字型，離線可跑 -->
<style>
/* ============================================================
   幕聊 · 防自爆流程 —— WebView 正式版
   從 refined.html 的「02 · 防自爆」deck 抽出、拿掉桌機展示外框，
   改成吃滿真實裝置螢幕、支援 safe-area 的全螢幕版本。
   視覺 token、文案、骨架與 app-writing.html 同一套，未改寫。

   對應 demo-script.md 第二幕（45 秒）：
   使用者自己打字帶防禦語氣 → 幕聊攔下來，描述「對方會怎麼讀」，
   給出建議版本，不判使用者對錯。
   ============================================================ */

:root{
  --void:  #040506;
  --ink:   #07080a;
  --obsid: #111214;
  --graph: #1b1c1e;
  --slate: #363739;
  --iron:  #454647;
  --smoke: #6a6b6c;
  --ash:   #9c9c9d;
  --mist:  #e6e6e6;
  --white: #ffffff;

  --coral: #ff6363;
  --ember: #452324;
  --amber: #4a3a1f;

  --host-bg:   #f2f2f3;
  --host-card: #ffffff;
  --host-line: #dfdfe0;
  --host-ink:  #1b1c1e;
  --host-key:  #d4d4d5;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Monaco, monospace;

  --vh: 1vh;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; height:100%; overscroll-behavior: none; }
body{
  height: calc(var(--vh, 1vh) * 100);
  background: var(--host-bg); color: var(--white);
  font-family: "Noto Sans TC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
button{ font-family: inherit; cursor: pointer; }

.screen{
  position: relative; width: 100%; height: 100%;
  display:flex; flex-direction:column;
  background: var(--host-bg);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

.apphead{
  flex:none; display:flex; align-items:center; gap:8px;
  padding:10px 16px; background: var(--host-card);
  box-shadow: rgba(27,28,30,0.07) 0 1px 0 0;
}
.backchev{ width:24px; height:24px; flex:none; display:flex; align-items:center; justify-content:center; color: var(--smoke); font-size:18px; font-weight:300; }
.avatar{
  width:34px; height:34px; border-radius:9999px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:500; color:#7a6f5d; background:#e8e0d0;
}
.apphead .nm{ font-size:14px; font-weight:500; line-height:1.4; color: var(--host-ink); }
.apphead .sub{ font-size:11px; line-height:1.4; color: var(--smoke); }
.rolebadge{ font-size:9px; line-height:1; color:#8a8b8e; background:rgba(27,28,30,0.06); border-radius:4px; padding:3px 5px; margin-left:6px; }
.headdots{ margin-left:auto; color:#a2a3a6; font-size:18px; letter-spacing:2px; padding:4px; }

.thread{
  flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end;
  gap:8px; padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.bubwrap{ display:flex; align-items:flex-end; gap:6px; max-width:86%; align-self:flex-start; }
.bub-av{
  width:26px; height:26px; border-radius:9999px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:500; color:#7a6f5d; background:#e8e0d0;
}
.bubble{
  border-radius:4px 14px 14px 14px; padding:9px 13px;
  font-size:15px; line-height:1.55; color: var(--host-ink); text-wrap:pretty;
  background: var(--host-card);
  box-shadow: rgba(27,28,30,0.06) 0 1px 2px 0, rgba(27,28,30,0.04) 0 0 0 1px;
}
.bubmeta{
  flex:none; display:flex; flex-direction:column; align-items:flex-start; gap:1px;
  font-size:9px; line-height:1.3; color:#a2a3a6; padding-bottom:2px;
}

.composer{
  flex:none; display:flex; align-items:flex-end; gap:8px;
  padding:8px 16px 12px; border-top:1px solid var(--host-line); background: var(--host-card);
}
.field{
  flex:1; min-height:40px; border-radius:8px; background:#ededee;
  box-shadow: rgba(27,28,30,0.08) 0 0 0 1px inset;
  display:block;
  padding:9px 13px; font-size:15px; line-height:1.6; color: var(--host-ink);
  line-break:strict;
}
.sendbtn{ width:40px; height:40px; flex:none; border-radius:8px; background: var(--host-bg); }
.caret{ display:inline-block; width:1.5px; height:16px; background: var(--iron); margin-left:2px; vertical-align:-3px;
  animation: blink 1.1s steps(2, jump-none) infinite; }
@keyframes blink{ 0%,45%{ opacity:1 } 50%,95%{ opacity:0 } 100%{ opacity:1 } }

/* 兩種標記：形狀不同、顏色不同，紅色永不出現 */
.mark-typo{ border-bottom:1px dotted var(--ash); }
.mark-tone{ background: rgba(69,35,36,0.14); border-bottom:2px solid var(--ember); padding-bottom:1px; }

/* ============================================================
   幕聊面板 —— 骨架與代寫共用，只換內容：
   眉標「對方會怎麼讀」、主動作「替換」、不需要「附加」
   （輸入法本來就看得到你自己打的字）
   ============================================================ */
.panel{
  position:relative; flex:none;
  background: linear-gradient(180deg, #0a0b0d 0%, var(--ink) 100%);
  border-radius:16px 16px 0 0; overflow:hidden;
  box-shadow: rgba(255,255,255,0.28) 0 1px 0 0 inset,
              rgba(255,255,255,0.06) 0 0 0 1px;
}

.panel-row{ min-height:56px; display:flex; align-items:center; gap:8px; padding:8px 8px 8px 16px; }
.panel-hit{
  flex:1; min-width:0; display:flex; align-items:center; gap:8px;
  border:0; background:transparent; padding:8px 0; text-align:left; min-height:44px;
}
.panel-txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.panel-eyebrow{ display:flex; align-items:center; gap:8px; }
.eyebrow{
  font-family: var(--mono); font-size:10px; line-height:1;
  letter-spacing:.8px; text-transform:uppercase; color: var(--smoke);
}
.panel-title{
  font-size:13px; font-weight:500; line-height:1.3; color: var(--white);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.diamond{ background: var(--coral); transform: rotate(45deg); flex:none; }

.btn-adopt{
  flex:none; height:44px; min-width:44px; padding:0 16px; border-radius:8px; border:0;
  background: var(--mist); color: var(--iron); font-size:14px; font-weight:500;
  box-shadow: rgba(255,255,255,0.85) 0 1px 0 0 inset, rgba(0,0,0,0.30) 0 -1.5px 0 0 inset;
  transition: transform 110ms var(--ease), background 110ms var(--ease);
}
.btn-adopt:active{ transform: translateY(1px) scale(0.98); background: var(--white); }
.chevron{
  flex:none; width:44px; height:44px; border:0; background:transparent; border-radius:8px;
  font-family: var(--mono); font-size:11px; color: var(--smoke);
  display:flex; align-items:center; justify-content:center;
}
.chevron span{ display:inline-block; transition: transform 200ms var(--ease); }
.panel[data-open="true"] .chevron span{ transform: rotate(180deg); }

.panel-body{
  background: var(--obsid);
  box-shadow: rgba(255,255,255,0.04) 0 1px 0 0 inset;
  display:grid; grid-template-rows:0fr;
  transition: grid-template-rows 200ms var(--ease);
}
.panel[data-open="true"] .panel-body{ grid-template-rows:1fr; }
.panel-body > div{ overflow:hidden; }
.panel-in{ padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:8px; }
.panel[data-open="true"] .panel-in > *{ animation: rise 420ms var(--ease) both; }
.panel[data-open="true"] .panel-in > *:nth-child(1){ animation-delay:60ms; }
.panel[data-open="true"] .panel-in > *:nth-child(2){ animation-delay:160ms; }
@keyframes rise{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }

.sugtext{ font-size:17px; font-weight:400; line-height:1.68; letter-spacing:.01em; color: var(--white); text-wrap:pretty; }

.srcline{
  font-family: var(--mono); font-size:10px; letter-spacing:.4px; line-height:1.6;
  color: var(--smoke); display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-variant-numeric: tabular-nums;
}
.srcline .sdot{ width:3px; height:3px; border-radius:9999px; background: var(--iron); flex:none; }

.footrow{ display:flex; align-items:flex-end; gap:12px; }
.sugreason{ flex:1; font-size:12px; line-height:1.5; color: var(--smoke); text-wrap:pretty; }

/* ---------- 注音鍵盤（僅視覺，不接系統輸入法） ---------- */
.kbd{ flex:none; background: var(--mist); padding:8px 4px 12px; padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:6px; }
.kbd-row{ display:flex; gap:5px; justify-content:center; padding:0 4px; }
.key{
  flex:1; height:40px; border-radius:8px; background: var(--host-card); color: var(--iron);
  display:flex; align-items:center; justify-content:center; font-size:14px;
  box-shadow: rgba(0,0,0,0.22) 0 1px 0 0;
}
.key.mod{ background: var(--host-key); box-shadow: rgba(0,0,0,0.16) 0 1px 0 0; }

.qabadge{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 4px); right:8px; z-index:99;
  font-family: var(--mono); font-size:8px; letter-spacing:1px; color: rgba(0,0,0,0.28);
  pointer-events:none;
}
</style>
</head>
<body>

<div class="screen">
  <div class="apphead">
    <span class="backchev">‹</span>
    <div class="avatar">王</div>
    <div style="display:flex;align-items:center">
      <div>
        <div class="nm">王經理</div>
        <div class="sub">宏碩採購</div>
      </div>
      <span class="rolebadge">客戶</span>
    </div>
    <span class="headdots">···</span>
  </div>

  <div class="thread">
    <div class="bubwrap">
      <div class="bub-av">王</div>
      <div class="bubble">這個價格比別家貴很多耶。</div>
      <div class="bubmeta"><span>14:33</span></div>
    </div>
    <div class="bubwrap">
      <div class="bub-av">王</div>
      <div class="bubble">交期到底能不能給我確定的？</div>
      <div class="bubmeta"><span>已讀</span><span>14:34</span></div>
    </div>
  </div>

  <div class="composer">
    <div class="field" id="fieldB"></div>
    <div class="sendbtn"></div>
  </div>

  <div class="panel" id="panelB" data-open="false" hidden>
    <div class="panel-row">
      <button class="panel-hit" id="hitB">
        <span class="panel-txt">
          <span class="panel-eyebrow">
            <i class="diamond" style="width:6px;height:6px"></i>
            <span class="eyebrow">幕聊 · 對方會怎麼讀</span>
          </span>
          <span class="panel-title" id="titleB"></span>
        </span>
      </button>
      <button class="btn-adopt" id="replaceBtn">替換</button>
      <button class="chevron" id="chevB" aria-label="展開"><span>▴</span></button>
    </div>

    <div class="panel-body"><div><div class="panel-in">
      <div class="sugtext" id="suggB"></div>
      <div class="footrow">
        <span class="sugreason"></span>
        <button class="linkbtn" id="dismissBtn">照我的送</button>
      </div>
    </div></div></div>
  </div>

  <div class="kbd" data-kbd></div>
</div>

<span class="qabadge">幕聊 · app-selfburn</span>

<script>
"use strict";

function setVH(){ document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px"); }
setVH();
addEventListener("resize", setVH);
addEventListener("orientationchange", setVH);

/* ============================================================
   JS Bridge（照 docs/js-bridge契約.md）
   原生 → 網頁：EQ.setState("idle"|"checking")、EQ.render(payload)
   網頁 → 原生：EQNative.replace(text)、EQNative.dismiss()
   payload：{flagged, type, reason, spans[{start,end,label}], suggestion, draft}
   spans 是 draft 的字元索引（0 起算、含頭不含尾），draft 原樣、不 trim。
   idle ＝面板整個不佔位（hidden）。checking 畫面不變，避免閃爍。
   ============================================================ */

const BRIDGED = !!window.EQNative;
const $ = (id) => document.getElementById(id);
const field = $("fieldB");
const panel = $("panelB");
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let current = null;   // 最近一次 render 的 payload

/* spans → 帶標記的輸入框內容。label 含「錯」「字」走灰點線，其餘走語氣實線 */
function markDraft(draft, spans) {
  const sorted = (spans || []).slice().sort((a, b) => a.start - b.start);
  let html = "", cursor = 0;
  sorted.forEach(sp => {
    if (sp.start < cursor) return;                    /* 重疊的略過，保底不壞版 */
    html += esc(draft.slice(cursor, sp.start));
    const cls = /錯|字/.test(sp.label || "") ? "mark-typo" : "mark-tone";
    html += '<span class="' + cls + '">' + esc(draft.slice(sp.start, sp.end)) + "</span>";
    cursor = sp.end;
  });
  html += esc(draft.slice(cursor));
  return html + '<span class="caret"></span>';
}

window.EQ = {
  setState(s) {
    if (s === "idle") {
      panel.hidden = true; panel.dataset.open = "false"; current = null;
    }
    /* checking：畫面不變 */
  },
  render(p) {
    if (!p || p.flagged === false) { EQ.setState("idle"); return; }
    current = p;
    field.classList.add("typed");
    field.innerHTML = markDraft(p.draft, p.spans);
    $("titleB").textContent = p.reason || "";
    $("suggB").textContent = p.suggestion || "";
    panel.hidden = false;
    panel.dataset.open = "false";
  }
};

const toggle = () => { panel.dataset.open = panel.dataset.open === "true" ? "false" : "true"; };
$("chevB").addEventListener("click", toggle);
$("hitB").addEventListener("click", toggle);

/* 替換：交給原生寫回輸入框；後續狀態由原生驅動（成功即 setState("idle")） */
$("replaceBtn").addEventListener("click", () => {
  if (current) window.EQNative.replace(current.suggestion);
});
/* 照我的送：收起建議條，同一段草稿不再提醒 */
$("dismissBtn").addEventListener("click", () => { window.EQNative.dismiss(); });

/* ---------- 注音鍵盤（視覺，不接系統輸入法） ---------- */
const KEY_ROWS = [
  "ㄅㄉˇˋㄓˊ˙ㄚㄞㄢ".split("").map(c => ({ label: c, flex: 1 })),
  "ㄆㄊㄍㄐㄔㄗㄧㄛㄟㄣ".split("").map(c => ({ label: c, flex: 1 })),
  "ㄇㄋㄎㄑㄕㄘㄨㄜㄠㄤ".split("").map(c => ({ label: c, flex: 1 })),
  [{ label: "⇧", flex: 1.4, mod: true },
   ...["ㄈ","ㄌ","ㄏ","ㄒ","ㄖ","ㄙ"].map(c => ({ label: c, flex: 1 })),
   { label: "⌫", flex: 1.4, mod: true }],
  [{ label: "?123", flex: 1.6, mod: true },
   { label: "，", flex: 1 },
   { label: "", flex: 4.4 },
   { label: "。", flex: 1 },
   { label: "↵", flex: 1.6, mod: true }]
];
const KBD_HTML = KEY_ROWS.map(row =>
  '<div class="kbd-row">' + row.map(k =>
    '<div class="key' + (k.mod ? " mod" : "") + '" style="flex:' + k.flex + '">' + k.label + '</div>'
  ).join("") + '</div>'
).join("");
document.querySelectorAll("[data-kbd]").forEach(el => { el.innerHTML = KBD_HTML; });

/* ============================================================
   Mock 區塊（契約規定內建，不要刪）：
   沒有原生環境就退回內建假資料——雙擊 HTML 走完整流程。
   場景走 demo 第二幕（價格防禦句）。QA：?flag=0 看 flagged:false（面板不出現）。
   ============================================================ */
if (!window.EQNative) {
  window.EQNative = {
    replace: (t) => {
      field.classList.add("typed");
      field.innerHTML = esc(t) + '<span class="caret"></span>';
      setTimeout(() => EQ.setState("idle"), 200);
    },
    dismiss: () => EQ.setState("idle")
  };
  const MOCK = {
    flagged: true,
    type: "defensive",
    reason: "他讀起來會像被下戰帖",
    spans: [{ start: 3, end: 11, label: "防禦" }, { start: 16, end: 18, label: "錯字" }],
    suggestion: "這個價格包含 A、B、C。如果預算有考量，我們也有 Y 方案可以談。",
    draft: "我們的品質跟別人不一樣，你可以去筆較看看。"
  };
  const flag = new URLSearchParams(location.search).get("flag");
  /* 先看到自己打的字，半拍後建議條長出來（推開內容，不是蓋住） */
  field.classList.add("typed");
  field.innerHTML = markDraft(MOCK.draft, []);
  setTimeout(() => {
    if (flag === "0") { EQ.render({ flagged: false }); return; }
    EQ.render(MOCK);
  }, 900);
}
</script>
</body>
</html>
